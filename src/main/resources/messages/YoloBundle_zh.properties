warning.skip.title=Agent YOLO — 已开启跳过权限
warning.skip.body=<html>你正在以"跳过权限"（YOLO 模式）启动 AI agent。<br><br>该 agent 将在<b>无需确认</b>的情况下运行命令、修改文件，可能造成不可逆的更改、执行不受信任的代码或暴露你的系统。<br><br>仅在可信环境中继续。</html>
warning.skip.doNotShow=下次不再提醒
button.launchAnyway=仍然启动
settings.skipWarning.label=以"跳过权限"启动时不再弹出此警告

