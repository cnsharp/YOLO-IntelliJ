# ── Provider injection notes（provider 对话框中的 LLM 后端配置提示）──
# {0} 为把 API Key 注入到子进程的 env 变量名。
provider.note.gemini=Gemini CLI 仅通过环境变量读取 GEMINI_API_KEY；官方未提供 base URL 的环境变量覆盖（个别版本有非官方的 GOOGLE_GEMINI_BASE_URL，可用下方「额外环境变量」填写）。
provider.note.codebuddy=CodeBuddy 的模型写入 ~/.codebuddy/models.json（id 以 yolo- 前缀），API Key 通过环境变量 {0} 注入（配置中以 '${...}' 引用）；设置会持久化。
provider.note.opencode=OpenCode 的 base URL / API Key 写入 opencode.json（provider.<id>.options），API Key 通过环境变量 {0} 注入；设置会持久化。
provider.note.codex=Codex 的 base URL / model 写入 ~/.codex/config.toml（model_providers + model_provider），API Key 通过环境变量 {0} 注入；这些设置会持久化。
provider.note.cline=Cline 的 provider（OpenAI Compatible）写入 ~/.cline/data/settings/providers.json：base URL / model 由 YOLO 写入，但 API Key 配置不支持环境变量引用，需你在该 provider 的 config.apiKey 中自行填写；设置会持久化。
provider.note.kilo=Kilo 的 provider（openai-compatible）写入 ~/.config/kilo/kilo.jsonc，API Key 通过环境变量 {0} 注入（配置中以 '{env:...}' 引用）；设置会持久化。
provider.note.kimi=Kimi 的 provider 写入 ~/.kimi/config.toml（openai_legacy/openai_responses，base_url/api_key）：base_url / model 由 YOLO 写入，但 api_key 配置不支持环境变量引用，需你自行填写；设置会持久化。
provider.note.openclaw=OpenClaw 的 provider 写入 ~/.openclaw/openclaw.json（models.providers.<name>.baseUrl/apiKey），API Key 通过环境变量 {0} 注入；设置会持久化。
provider.note.pi=Pi 的自定义模型写入 ~/.pi/agent/models.json（api/baseUrl/apiKey），API Key 通过环境变量 {0} 注入；设置会持久化。
provider.note.continue=Continue 的模型写入 ~/.continue/config.yaml（models[]，apiBase/apiKey），apiKey 通过 secrets 从 ~/.continue/.env 读取，需你自行在该文件写入 {0}=你的密钥；设置会持久化。
