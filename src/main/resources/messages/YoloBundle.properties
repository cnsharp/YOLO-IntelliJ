# ── Provider injection notes (LLM backend configuration hints in the provider dialog) ──
# {0} is the env var name carrying the API key into the spawned process.
provider.note.gemini=Gemini CLI reads only the GEMINI_API_KEY environment variable; the official build provides no env-var override for the base URL (some versions accept the unofficial GOOGLE_GEMINI_BASE_URL, which can be set via the extra environment variables below).
provider.note.codebuddy=CodeBuddy''s model is written to ~/.codebuddy/models.json (id is prefixed with yolo-); the API key is injected via the {0} environment variable (referenced in config as '${...}'); settings persist.
provider.note.opencode=OpenCode''s base URL / API key are written to opencode.json (provider.<id>.options); the API key is injected via the {0} environment variable; settings persist.
provider.note.codex=Codex''s base URL / model are written to ~/.codex/config.toml (model_providers + model_provider); the API key is injected via the {0} environment variable; these settings persist.
provider.note.cline=Cline''s provider (OpenAI Compatible) is written to ~/.cline/data/settings/providers.json: base URL / model are written by YOLO, but the API key cannot reference an environment variable in config, so you must fill config.apiKey yourself; settings persist.
provider.note.kilo=Kilo''s provider (openai-compatible) is written to ~/.config/kilo/kilo.jsonc; the API key is injected via the {0} environment variable (referenced in config as '{env:...}'); settings persist.
provider.note.kimi=Kimi''s provider is written to ~/.kimi/config.toml (openai_legacy/openai_responses, base_url/api_key): base_url / model are written by YOLO, but api_key cannot reference an environment variable in config, so you must fill it yourself; settings persist.
provider.note.openclaw=OpenClaw''s provider is written to ~/.openclaw/openclaw.json (models.providers.<name>.baseUrl/apiKey); the API key is injected via the {0} environment variable; settings persist.
provider.note.pi=Pi''s custom model is written to ~/.pi/agent/models.json (api/baseUrl/apiKey); the API key is injected via the {0} environment variable; settings persist.
provider.note.continue=Continue''s model is written to ~/.continue/config.yaml (models[], apiBase/apiKey); the API key is read from ~/.continue/.env via secrets, so you must add {0}=your-key there yourself; settings persist.
